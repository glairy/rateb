<title>Rateb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: phone-first money wallet. One column of cards, bottom tab bar, sheet-style forms. */
:root{
  --bg:#eef2f0; --card:#ffffff; --ink:#13201b; --muted:#5f6f68; --line:#d9e2dd; --soft:#e4ebe7;
  --accent:#0f7a62; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --gold:#a86a12; --gold-soft:#f6ead6; --good:#18794e; --bad:#b4372e; --warn:#a86a12;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-num:"Fraunces","IBM Plex Sans Arabic",Georgia,serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1311; --card:#141d1a; --ink:#e6eeea; --muted:#93a59d; --line:#24312c; --soft:#1b2723;
  --accent:#3fc69f; --accent-ink:#06130f; --accent-soft:#16332a;
  --gold:#e3b25c; --gold-soft:#2e2414; --good:#4fcf91; --bad:#f07b70; --warn:#e3b25c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1311; --card:#141d1a; --ink:#e6eeea; --muted:#93a59d; --line:#24312c; --soft:#1b2723;
  --accent:#3fc69f; --accent-ink:#06130f; --accent-soft:#16332a;
  --gold:#e3b25c; --gold-soft:#2e2414; --good:#4fcf91; --bad:#f07b70; --warn:#e3b25c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.app{max-width:560px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:var(--f-num);font-size:24px;font-weight:600;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:600}
.card .hint{margin:0;color:var(--muted);font-size:13px}
.pot{background:linear-gradient(160deg,var(--gold-soft),var(--card) 70%);border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.lbl svg{width:14px;height:14px;flex:none}
.big{font-family:var(--f-num);font-weight:600;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-family:var(--f-body);font-size:15px;font-weight:500;color:var(--muted);margin-inline-start:6px;letter-spacing:0}
.mid{font-family:var(--f-num);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.pot .track i{background:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.row span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.row.t{font-weight:600;border-top:1px solid var(--line);padding-top:8px}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)} .stat .v{font-weight:600;font-variant-numeric:tabular-nums;font-size:17px}
.bars{display:grid;gap:10px}
.bar{display:grid;gap:4px}
.bar .bt{position:relative;height:8px;border-radius:99px;background:var(--soft)}
.bar .bt i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:var(--accent)}
.bar .bt b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);border-radius:2px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.alert{border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;display:grid;gap:8px}
.nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);padding:9px 4px 10px;display:grid;justify-items:center;gap:2px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
form{display:grid;gap:12px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.f.chk{display:flex;align-items:center;gap:8px} .f.chk input{width:auto}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.appbox{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.appbox h3{margin:0;font-size:14px}
.calc{background:var(--soft);border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:14px}
.list{display:grid}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .l{min-width:0;display:grid}
.it .l b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .l span{font-size:12px;color:var(--muted)}
.it .r{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{font:inherit;font-size:12px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:4px 8px;cursor:pointer}
.icon-btn.sure{color:var(--bad);border-color:var(--bad)}
.adv summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.adv[open]{display:grid;gap:10px}
.apps{display:grid;gap:8px}
.approw{display:grid;grid-template-columns:minmax(64px,1fr) 1.2fr 1fr;gap:8px;align-items:center}
.approw.head span{font-size:12px;color:var(--muted)}
.approw input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
details.more{display:grid;gap:10px} details.more[open]{display:grid;gap:10px}
details.more summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
.chips button{font-size:13px;padding:5px 12px}
.icon-btn.done{color:var(--good);border-color:var(--good)}
.it.faded .l b{color:var(--muted);text-decoration:line-through}
.fab{position:fixed;inset-inline-end:max(18px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;z-index:5}
.welcome{font-family:var(--f-num);font-size:26px}
.payday{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)}
.payday .card{width:100%;max-width:420px;max-height:calc(100dvh - 32px);overflow:auto;display:grid;gap:12px;text-align:center}
.payday .tag{color:var(--accent);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.payday .big{justify-content:center}
.payday .lines{display:grid;gap:8px;text-align:start;border-top:1px solid var(--line);padding-top:12px}
.payday .note{font-size:14px;color:var(--muted)}
.payday .plus{color:var(--good);font-weight:700}
.payday .minus{color:var(--bad);font-weight:700}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
[hidden]{display:none!important}
.toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:6}
.toast span{background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 16px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
[dir="rtl"] .flip{transform:scaleX(-1)}
@media (prefers-reduced-motion:no-preference){.track i,.bar .bt i{transition:width .5s cubic-bezier(.2,.7,.2,1)}}
</style>

<div class="app" id="app">
  <div class="top">
    <div><div class="brand" id="brand">Rateb</div><div class="sub" id="status">Loading…</div></div>

  <main id="view"><div class="card"><p class="hint">Loading your money…</p></div></main>
</div>
<nav class="nav" aria-label="Main"><div class="in" id="nav"></div></nav>
<button class="fab" id="fab" type="button" aria-label="Add" hidden>+</button>
<div class="toast" id="toast" hidden><span id="toastText"></span></div>

function fuelStats() {
  const s = S.settings;
  const fills = [...S.fuel].sort((a, b) => String(a.date).localeCompare(String(b.date)) || n(a.odo) - n(b.odo));
  let km = 0, lit = 0, prevFull = null, pending = 0, count = 0;
  for (const f of fills) {
    if (!f.full) { pending += n(f.liters); continue; }
    const liters = n(f.liters) + pending; pending = 0;
    let d = n(f.trip_km);
    if (!d && prevFull && n(f.odo) && n(prevFull.odo)) d = n(f.odo) - n(prevFull.odo);
    if (d > 0 && liters > 0 && (n(f.trip_km) || prevFull)) { km += d; lit += liters; count++; }
    prevFull = f;
  }
  const avg = lit ? km / lit : null;
  const use = avg || n(s.default_km_l) || 14;
  const lastFull = [...fills].reverse().find(f => f.full);
  const openL = lastFull ? fills.filter(f => !f.full && (String(f.date) > String(lastFull.date) || n(f.odo) > n(lastFull.odo))).reduce((a, f) => a + n(f.liters), 0) : 0;
  return {avg, use, costKm: n(s.fuel_price) / use, count, km, lit, lastFull, openL};
}

}

function personalKm(X) {

  if (!b || b.app !== "rateb" || typeof b.settings !== "object") { toast(t("bkBad")); return; }
  await write(async () => {
    for (const c of COLS) for (const [id, d] of Object.entries(b[c] || {})) if (/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id) && d && typeof d === "object") await coll(c).doc(id).set(d);
    const {lang: _l, ...st} = b.settings; await db.doc("data/users/" + uid + "/settings").set({...DEFAULTS, ...st, lang});
  });
  toast(t("bkDone"));
}

/* ---------- shell ---------- */
function persistView() { try { localStorage.setItem("rateb-view", view); } catch (e) {} }
function renderNav() {
  $("#nav").replaceChildren(...["home", "add", "history", "settings"].map(k => {
    const b = el("button", {class: "tab", type: "button", "aria-current": view === k ? "page" : null, onclick: () => { view = k; if (k !== "add") editing = null; persistView(); render(); window.scrollTo(0, 0); }}, svgEl(ICON[k]), el("span", {text: t(k)}));
    return b;
  }));
}
function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("#brand").textContent = t("brand"); $("#langBtn").textContent = t("lang"); if (statusKey) $("#status").textContent = t(statusKey);
}
function render() {
  applyLang(); renderNav();
  if (!S.ready) return;
  $("#fab").hidden = view === "add" || S.needsSetup || readOnly;
  $(".nav").hidden = !!S.needsSetup;
  if (S.needsSetup) { $("#view").replaceChildren(el("div", {style: "display:grid;gap:14px"}, renderSetup())); return; }
  const v = {home: renderHome, add: renderAdd, history: renderHistory, settings: renderSettings}[view] || renderHome;
  const keepScroll = view === "settings" ? window.scrollY : 0;
  $("#view").replaceChildren(el("div", {style: "display:grid;gap:14px"}, ...v()));
  if (keepScroll) window.scrollTo(0, keepScroll);
  renderPayday();
}
$("#fab").addEventListener("click", () => { view = "add"; editing = null; persistView(); render(); window.scrollTo(0, 0); });
$("#langBtn").addEventListener("click", async () => { lang = lang === "en" ? "ar" : "en"; langPinned = true; try { localStorage.setItem("rateb-lang", lang); } catch (e) {} render(); if (db && uid && !readOnly) saveSettings({lang}, false, true).catch(() => {}); });
let langPinned = false;
try { const l = localStorage.getItem("rateb-lang"); if (l === "ar" || l === "en") { lang = l; langPinned = true; } } catch (e) {}
render();

(async () => {
  const status = $("#status");
  const timer = setTimeout(() => { if (!S.ready) status.textContent = t("offline"); }, 10000);
  db = await claude.use("db");
  const user = await claude.use("user");
  uid = user ? await user.id() : null;
  if (!db || !uid) { clearTimeout(timer); status.textContent = t("signin"); $("#view").replaceChildren(el("div", {class: "card"}, el("p", {class: "hint", text: t("signin")}))); return; }
  base = "data/users/" + uid + "/app";
  const got = new Set();
  const done = () => { if (got.size >= COLS.length + 1 && !S.ready) { S.ready = true; clearTimeout(timer); statusKey = "synced"; status.textContent = t("synced"); } render(); };
  db.doc("data/users/" + uid + "/settings").onSnapshot(snap => {
    S.settings = {...DEFAULTS, ...(snap.exists ? snap.data() : {})};
    S.needsSetup = !snap.exists;
    if (snap.exists && snap.data().lang && !langPinned) lang = snap.data().lang;
    got.add("settings"); done();
  }, err => { status.textContent = err.message; });
  COLS.forEach(c => coll(c).onSnapshot(snap => {
    S[c] = snap.docs.map(d => ({id: d.id, ...d.data()}));
    got.add(c); done();
  }, err => { status.textContent = err.message; }));
})();
</script>
